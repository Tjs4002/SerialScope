name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        shell: cmd
        run: tests\run-tests.bat

      - name: Build
        shell: cmd
        run: build.bat

      # Code signing through SignPath Foundation (free for open source). Skipped until the
      # repository has a SIGNPATH_API_TOKEN secret and a SIGNPATH_ORGANIZATION_ID variable.
      - name: Upload unsigned exe for signing
        id: unsigned
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: SerialScope-unsigned
          path: bin/SerialScope.exe

      - name: Sign with SignPath
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: SerialScope
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed exe
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: Copy-Item signed/SerialScope.exe bin/SerialScope.exe -Force

      - name: Prepare release files
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { 'dev' }
          $hash = (Get-FileHash bin/SerialScope.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SerialScope.exe" | Set-Content bin/SHA256SUMS.txt -Encoding ascii

          # Scoop manifest pointing at this release
          $manifest = Get-Content packaging/scoop/serialscope.json -Raw | ConvertFrom-Json
          $manifest.version = $version
          $manifest.url = "https://github.com/Tjs4002/SerialScope/releases/download/v$version/SerialScope.exe"
          $manifest.hash = $hash
          $manifest | ConvertTo-Json -Depth 5 | Set-Content bin/serialscope.json -Encoding utf8NoBOM
          Write-Host "SerialScope $version  sha256 $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialScope
          path: |
            bin/SerialScope.exe
            bin/SHA256SUMS.txt
            bin/serialscope.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/SerialScope.exe
            bin/SHA256SUMS.txt
            bin/serialscope.json
          generate_release_notes: true
